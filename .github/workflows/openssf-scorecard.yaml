# policy, and support documentation.

name: "OpenSSF Scorecard"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  # For Branch-Protection check. Only the default branch is supported. See
  # https://github.com/ossf/scorecard/blob/main/docs/checks.md#branch-protection
  branch_protection_rule:
  # To guarantee Maintained check is occasionally updated. See
  # https://github.com/ossf/scorecard/blob/main/docs/checks.md#maintained
  schedule:
    - cron: "50 4 * * 0"
  push:
    branches: ["main", "master"]

# Declare default permissions as none.
permissions: {}

jobs:
  openssf-scorecard:
    name: "OpenSSF Scorecard"
    # yamllint disable-line rule:line-length
    uses: lfreleng-actions/security-workflows/.github/workflows/openssf-scorecard.yaml@ef6c0d9930feedb274067703b50eeebe5ab859b3  # v0.9.5
    permissions:
      contents: read  # checkout
      security-events: write  # upload results to the code scanning dashboard
      id-token: write  # publish results and obtain the badge, via OIDC
      actions: read  # upload-sarif reads run info on private repositories
      # The lane's scan job requests only the scopes above, so granting
      # more here has no effect, including on a private repository.
